<svg xmlns="http://www.w3.org/2000/svg" width="580" height="260" viewBox="0 0 580 260" role="img" aria-labelledby="title desc"><title id="title">AIDE — MMTL-UniAD experiments</title><desc id="desc">Schematic view frames slowly align to represent multimodal information fusion.</desc><style>@keyframes plane1{0%,12%,100%{transform:translate(0,0)}45%,68%{transform:translate(37px,32px)}}@keyframes plane3{0%,12%,100%{transform:translate(0,0)}45%,68%{transform:translate(-37px,-32px)}}.plane1{animation:plane1 11s ease-in-out infinite}.plane3{animation:plane3 11s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.animated{animation:none!important}.live-dot,.scan,.stream{display:none!important}.draw{stroke-dashoffset:0!important;opacity:1!important}.tile{opacity:1!important}.plane{transform:none!important}}
@media(prefers-reduced-motion:reduce){.animated{animation:none!important}.surface-live,.live-dot,.scan,.stream{display:none!important}.surface-static{display:block!important}.draw{stroke-dashoffset:0!important;opacity:1!important}.tile{opacity:1!important}.plane{transform:none!important}}</style><rect width="580" height="260" fill="#eaf1f4" /><text x="26" y="37" font-family="Consolas,Menlo,monospace" font-size="15" fill="#607780" letter-spacing="1.2">03 / MULTIMODAL</text><text x="24" y="145" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="64" fill="#173541" letter-spacing="-1" font-weight="550">AIDE</text><text x="27" y="222" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#607780">MMTL-UniAD experiments</text><g class="plane plane1 animated"><rect x="320" y="70" width="143" height="90" fill="#829ba9" fill-opacity=".15" stroke="#829ba9" stroke-width="1.5" /><path d="M334 84h25M334 84v17M449 146h-25M449 146v-17" fill="none" stroke="#829ba9" stroke-width="2" /></g><g class="plane plane2 animated"><rect x="357" y="102" width="143" height="90" fill="#447fa5" fill-opacity=".15" stroke="#447fa5" stroke-width="1.5" /><path d="M371 116h25M371 116v17M486 178h-25M486 178v-17" fill="none" stroke="#447fa5" stroke-width="2" /></g><g class="plane plane3 animated"><rect x="394" y="134" width="143" height="90" fill="#426d78" fill-opacity=".15" stroke="#426d78" stroke-width="1.5" /><path d="M408 148h25M408 148v17M523 210h-25M523 210v-17" fill="none" stroke="#426d78" stroke-width="2" /></g></svg>